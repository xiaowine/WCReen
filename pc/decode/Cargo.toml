[package]
name = "decode"
description = "WCReen PC 端解码：FFmpeg 硬解（只硬解，绝不软解）+ NV12 → RGB 的 wgpu 帧通路"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# 版本与 feature 写法照抄 `pc/spike`（已验证可用，见 docs/plans/2026-10-07-pc-spike-implementation.md）。
# `wgpu` 直接依赖（而不是经 `eframe::wgpu`）：本 crate 不关心窗口系统，
# 版本必须与 `app` 用的 eframe 内嵌 wgpu 一致（workspace 锁到同一个 30.0.1）。
[dependencies]
ffmpeg-next = "9.0.0"
wgpu = "30.0.1"
