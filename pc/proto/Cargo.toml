[package]
name = "proto"
description = "WCReen 线协议：帧框架 + 控制消息（CRC32 + JSON）编解码 + DTO"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# 纯逻辑 crate：**不得**依赖 FFmpeg / egui / wgpu / tokio ——
# 这样协议编解码能在任何平台上单测（见 docs/spec/tech-stack/overview.md §4 的测试政策）。
[dependencies]
crc32fast = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
